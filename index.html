<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARMING PORTFOLIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Kanit",sans-serif;
    background:#fff;
    color:#222;
    min-height:100vh;
}

button{
    font-family:inherit;
}

/* ================= HEADER ================= */

header{
    height:90px;
    width:100%;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:700;
}

.logo span{
    color:#f47721;
}

.menu-btn{
    width:64px;
    height:64px;
    border:0;
    border-radius:15px;
    background:#f47721;
    color:white;
    font-size:34px;
    cursor:pointer;
}

/* ================= MENU ================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:5000;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.overlay.show{
    display:flex;
}

.menu{
    width:680px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #f47721;
    border-radius:28px;
    padding:28px 18px;
}

.menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.menu-head h2{
    color:#fff;
    font-size:27px;
}

.close{
    width:60px;
    height:60px;
    border-radius:15px;
    border:1px solid #555;
    background:#111;
    color:#fff;
    font-size:32px;
    cursor:pointer;
}

.menu-title{
    text-align:center;
    color:#aaa;
    font-size:20px;
    margin-bottom:22px;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.menu-item{
    min-height:130px;
    background:#1b1715;
    border:1px solid #f47721;
    border-radius:18px;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.menu-item:hover{
    background:#f47721;
}

.menu-icon{
    font-size:38px;
    margin-bottom:8px;
}

.menu-item b{
    font-size:18px;
}

/* ================= PAGE ================= */

.page{
    max-width:1100px;
    min-height:calc(100vh - 90px);
    margin:auto;
    padding:60px 6% 90px;
}

.page h1{
    font-size:55px;
    line-height:1.2;
    margin-bottom:8px;
}

.subtitle{
    color:#df7838;
    letter-spacing:5px;
    font-size:20px;
    margin-bottom:40px;
}

.back{
    display:inline-block;
    color:#df7838;
    font-size:20px;
    margin-bottom:35px;
    cursor:pointer;
}

/* ================= HOME ================= */

.home{
    max-width:1200px;
    min-height:calc(100vh - 90px);
    margin:auto;
    padding:70px 6%;
    display:grid;
    grid-template-columns:1fr 430px;
    align-items:center;
    gap:70px;
}

.hello{
    color:#df7838;
    font-size:24px;
    letter-spacing:6px;
    margin-bottom:20px;
}

.tarming{
    font-size:70px;
    line-height:1;
    margin-bottom:30px;
}

.tarming span{
    color:#f47721;
}

.home h1{
    font-size:32px;
    margin-bottom:15px;
}

.home p{
    color:#666;
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:13px 25px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.orange{
    background:#f47721;
    color:#fff;
    border:2px solid #f47721;
}

.white{
    background:#fff;
    color:#df7838;
    border:2px solid #df7838;
}

.photo{
    width:100%;
    border:4px solid #f47721;
    border-radius:28px;
    overflow:hidden;
}

.photo img{
    width:100%;
    display:block;
}

/* ================= HISTORY ================= */

.history-photo{
    width:430px;
    max-width:100%;
    margin:0 auto 30px;
    border:4px solid #f47721;
    border-radius:30px;
    overflow:hidden;
}

.history-photo img{
    width:100%;
    display:block;
}

.card{
    background:#fff;
    border:1px solid #eee;
    border-left:6px solid #f47721;
    border-radius:24px;
    padding:35px;
    box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.card h2{
    color:#e87532;
    font-size:30px;
    margin-bottom:20px;
}

.info{
    font-size:18px;
    line-height:1.9;
    margin:8px 0;
}

.info strong{
    color:#222;
}

/* ================= EDUCATION ================= */

.education{
    display:grid;
    gap:20px;
}

.edu{
    background:#fff;
    border:1px solid #eee;
    border-left:6px solid #f47721;
    border-radius:20px;
    padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.edu h2{
    color:#e87532;
    font-size:25px;
    margin-bottom:8px;
}

.edu p{
    color:#555;
    font-size:18px;
    line-height:1.7;
}

/* ================= UNIVERSITY ================= */

.uni{
    text-align:center;
    background:#fffaf5;
    border:2px solid #e87532;
    border-radius:28px;
    padding:45px 25px;
}

.uni h2{
    font-size:30px;
    margin-bottom:15px;
}

.uni h3{
    color:#e87532;
    font-size:25px;
    margin-bottom:10px;
}

.uni p{
    color:#666;
    font-size:19px;
    line-height:1.8;
}

/* ================= SKILLS ================= */

.skills{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.skill{
    padding:28px;
    border:1px solid #eee;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.skill h2{
    color:#e87532;
    margin-bottom:10px;
}

.skill p{
    color:#666;
    font-size:18px;
    line-height:1.7;
}

/* ================= RESEARCH ================= */

.research{
    display:grid;
    gap:25px;
}

.project{
    border:1px solid #eee;
    border-left:6px solid #f47721;
    border-radius:22px;
    padding:28px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.project h2{
    color:#e87532;
    margin-bottom:8px;
}

.project p{
    color:#666;
    font-size:18px;
    line-height:1.7;
}

/* ================= CONTACT ================= */

.contact{
    border-left:6px solid #f47721;
    border-radius:25px;
    padding:35px;
    border-top:1px solid #eee;
    border-right:1px solid #eee;
    border-bottom:1px solid #eee;
    box-shadow:0 12px 35px rgba(0,0,0,.06);
}

.contact div{
    font-size:19px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

.contact div:last-child{
    border-bottom:0;
}

.contact strong{
    color:#e87532;
}

/* ================= FOOTER ================= */

footer{
    background:#222;
    color:#fff;
    text-align:center;
    padding:30px;
    font-size:17px;
}

footer span{
    color:#f47721;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        height:80px;
    }

    .logo{
        font-size:27px;
    }

    .menu-btn{
        width:60px;
        height:60px;
    }

    .home{
        display:flex;
        flex-direction:column-reverse;
        padding:50px 6%;
        gap:35px;
        align-items:stretch;
    }

    .photo{
        max-width:430px;
        margin:auto;
    }

    .hello{
        font-size:19px;
    }

    .tarming{
        font-size:50px;
    }

    .home h1{
        font-size:27px;
    }

    .home p{
        font-size:17px;
    }

    .page{
        padding:45px 6% 70px;
    }

    .page h1{
        font-size:43px;
    }

    .skills{
        grid-template-columns:1fr;
    }

    .card{
        padding:25px;
    }

    .info{
        font-size:17px;
    }

    .menu{
        padding:22px 14px;
    }

    .menu-grid{
        gap:10px;
    }

    .menu-item{
        min-height:115px;
    }

    .menu-icon{
        font-size:32px;
    }

    .menu-item b{
        font-size:16px;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        TAR<span>MING</span>
    </div>

    <button class="menu-btn" onclick="openMenu()">

</header>

================= -->

<div id="app"></div>


<script>

/* =====================================================
   รูปโปรไฟล์
===================================================== */

const PROFILE_IMAGE =
"file_0000000085d47207b52f2b182e7429b3.png";


/* =====================================================
   เปิด / ปิดเมนู
===================================================== */

function openMenu(){

    document.getElementById("overlay")
        .classList.add("show");

}

function closeMenu(){

    document.getElementById("overlay")
        .classList.remove("show");

}


/* =====================================================
   เปลี่ยนหน้า
   สำคัญมาก:
   ทุกครั้งจะล้าง #app ก่อน
   จึงไม่มีหน้าอื่นต่ออยู่ด้านล่าง
===================================================== */

function go(page){

    closeMenu();

    window.location.hash = page;

    render(page);

    window.scrollTo({
        top:0,
        behavior:"instant"
    });

}


/* =====================================================
   สร้างหน้า
===================================================== */

function render(page){

    const app = document.getElementById("app");

    /* ล้างหน้าเก่าทิ้งทั้งหมด */
    app.innerHTML = "";

                    เทคโนโลยี และการพัฒนาตนเอง

                <div class="buttons">

                    <button
                        class="btn orange"

                        รู้จักผมมากขึ้น

                    <button
                        class="btn white"
                        onclick="go('contact')">
                        ติดต่อผม
                    </button>

            </div>

                <img
                    src="${PROFILE_IMAGE}"

            </div>

        </section>

    /* ================= HISTORY ================= */

    else if(page === "history"){

    else if(page === "research"){
