<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARMING PORTFOLIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Kanit",sans-serif;
    background:#fff;
    color:#222;
    min-height:100vh;
}

button{
    font-family:inherit;
}

header{
    height:90px;
    width:100%;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:700;
}

.logo span{
    color:#f47721;
}

.menu-btn{
    width:64px;
    height:64px;
    border:0;
    border-radius:15px;
    background:#f47721;
    color:white;
    font-size:34px;
    cursor:pointer;
}

/* ================= MENU ================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:5000;
    padding:20px;
    align-items:center;
    justify-content:center;
}

.overlay.show{
    display:flex;
}

.menu{
    width:680px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #f47721;
    border-radius:28px;
    padding:28px 18px;
}

.menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

.menu-head h2{
    color:white;
    font-size:27px;
}

.close{
    width:60px;
    height:60px;
    border-radius:15px;
    border:1px solid #555;
    background:#111;
    color:white;
    font-size:32px;
}

.menu-title{
    text-align:center;
    color:#aaa;
    font-size:20px;
    margin-bottom:22px;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.menu-item{
    min-height:130px;
    background:#1b1715;
    border:1px solid #f47721;
    border-radius:18px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.menu-item:hover{
    background:#f47721;
}

.menu-icon{
    font-size:38px;
    margin-bottom:8px;
}

.menu-item b{
    font-size:18px;
}

/* ================= APP ================= */

#app{
    min-height:calc(100vh - 90px);
}

/* ================= HOME ================= */

.home{
    max-width:1200px;
    min-height:calc(100vh - 90px);
    margin:auto;
    padding:70px 6%;
    display:grid;
    grid-template-columns:1fr 430px;
    align-items:center;
    gap:70px;
}

.hello{
    color:#df7838;
    font-size:24px;
    letter-spacing:6px;
    margin-bottom:20px;
}

.tarming{
    font-size:70px;
    line-height:1;
    margin-bottom:30px;
}

.tarming span{
    color:#f47721;
}

.home h1{
    font-size:32px;
    margin-bottom:15px;
}

.home p{
    color:#666;
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:13px 25px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.orange{
    background:#f47721;
    color:#fff;
    border:2px solid #f47721;
}

.white{
    background:#fff;
    color:#df7838;
    border:2px solid #df7838;
}

.photo{
    width:100%;
    border:4px solid #f47721;
    border-radius:28px;
    overflow:hidden;
}

.photo img{
    width:100%;
    display:block;
}

/* ================= COMMON PAGE ================= */

.page{
    max-width:1100px;
    min-height:calc(100vh - 90px);
    margin:auto;
    padding:60px 6% 100px;
}

.back{
    color:#df7838;
    font-size:20px;
    margin-bottom:35px;
    cursor:pointer;
}

.page h1{
    font-size:55px;
    margin-bottom:5px;
}

.subtitle{
    color:#df7838;
    letter-spacing:5px;
    font-size:20px;
    margin-bottom:40px;
}

/* ================= HISTORY ================= */

.history-photo{
    width:430px;
    max-width:100%;
    margin:0 auto 30px;
    border:4px solid #f47721;
    border-radius:30px;
    overflow:hidden;
}

.history-photo img{
    width:100%;
    display:block;
}

.card{
    background:white;
    border:1px solid #eee;
    border-left:6px solid #f47721;
    border-radius:24px;
    padding:35px;
    box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.card h2{
    color:#e87532;
    font-size:30px;
    margin-bottom:20px;
}

.info{
    font-size:18px;
    line-height:1.9;
    margin:7px 0;
}

.info strong{
    color:#222;
}

/* ================= EDUCATION ================= */

.education{
    display:grid;
    gap:18px;
}

.edu{
    background:#fff;
    border:1px solid #eee;
    border-left:6px solid #f47721;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.edu h2{
    color:#e87532;
    font-size:24px;
    margin-bottom:7px;
}

.edu p{
    color:#555;
    font-size:18px;
}

/* ================= UNIVERSITY ================= */

.uni{
    text-align:center;
    background:#fffaf5;
    border:2px solid #e87532;
    border-radius:28px;
    padding:40px 25px;
}

.uni img{
    width:230px;
    height:230px;
    object-fit:contain;
    margin-bottom:20px;
}

.uni h2{
    font-size:30px;
    margin-bottom:15px;
}

.uni h3{
    color:#e87532;
    font-size:25px;
}

.uni p{
    color:#666;
    font-size:19px;
}

/* ================= SKILLS ================= */

.skills{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.skill{
    padding:28px;
    border:1px solid #eee;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.skill h2{
    color:#e87532;
    margin-bottom:10px;
}

.skill p{
    color:#666;
    font-size:18px;
    line-height:1.7;
}

/* ================= RESEARCH ================= */

.research{
    display:grid;
    gap:30px;
}

.project{
    border:1px solid #eee;
    border-radius:25px;
    padding:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.project img{
    width:100%;
    max-height:550px;
    object-fit:cover;
    border-radius:18px;
    margin-bottom:18px;
}

.project h2{
    color:#e87532;
    margin-bottom:8px;
}

.project p{
    color:#666;
    font-size:18px;
    line-height:1.7;
}

/* ================= CONTACT ================= */

.contact{
    border-left:6px solid #f47721;
    border-radius:25px;
    padding:35px;
    border-top:1px solid #eee;
    border-right:1px solid #eee;
    border-bottom:1px solid #eee;
    box-shadow:0 12px 35px rgba(0,0,0,.06);
}

.contact div{
    font-size:19px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

.contact div:last-child{
    border-bottom:0;
}

.contact strong{
    color:#e87532;
}

footer{
    background:#222;
    color:#fff;
    text-align:center;
    padding:30px;
    font-size:17px;
}

footer span{
    color:#f47721;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        height:80px;
    }

    .logo{
        font-size:27px;
    }

    .menu-btn{
        width:60px;
        height:60px;
    }

    .home{
        display:flex;
        flex-direction:column-reverse;
        padding:50px 6%;
        gap:35px;
        align-items:stretch;
    }

    .photo{
        max-width:430px;
        margin:auto;
    }

    .hello{
        font-size:19px;
    }

    .tarming{
        font-size:50px;
    }

    .home h1{
        font-size:27px;
    }

    .home p{
        font-size:17px;
    }

    .page{
        padding:45px 6% 70px;
    }

    .page h1{
        font-size:43px;
    }

    .skills{
        grid-template-columns:1fr;
    }

    .menu{
        padding:22px 14px;
    }

    .menu-grid{
        gap:10px;
    }

    .menu-item{
        min-height:115px;
    }

    .menu-icon{
        font-size:32px;
    }

    .menu-item b{
        font-size:16px;
    }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        TAR<span>MING</span>
    </div>

    <button class="menu-btn" onclick="openMenu()">
        ☰
    </button>

</header>


<!-- ================= MENU ================= -->

<div class="overlay" id="overlay">

    <div class="menu">

        <div class="menu-head">

            <h2>TARMING PORTFOLIO</h2>

            <button class="close" onclick="closeMenu()">
                ×
            </button>

        </div>

        <div class="menu-title">
            Menu - เมนูต่างๆ
        </div>

        <div class="menu-grid">

            <div class="menu-item" onclick="showPage('home')">
                <div class="menu-icon">🏠</div>
                <b>หน้าหลัก</b>
            </div>

            <div class="menu-item" onclick="showPage('history')">
                <div class="menu-icon">👤</div>
                <b>ประวัติ</b>
            </div>

            <div class="menu-item" onclick="showPage('education')">
                <div class="menu-icon">🎓</div>
                <b>การศึกษา</b>
            </div>

            <div class="menu-item" onclick="showPage('university')">
                <div class="menu-icon">🏫</div>
                <b>มหาลัย</b>
            </div>

            <div class="menu-item" onclick="showPage('skills')">
                <div class="menu-icon">⚙️</div>
                <b>ทักษะ</b>
            </div>

            <div class="menu-item" onclick="showPage('research')">
                <div class="menu-icon">📁</div>
                <b>ผลงานวิจัย</b>
            </div>

            <div class="menu-item" onclick="showPage('contact')">
                <div class="menu-icon">💬</div>
                <b>ติดต่อผม</b>
            </div>

        </div>

    </div>

</div>


<!-- =================
     จุดเดียวที่แสดงหน้า
================= -->

<div id="app"></div>


<footer>
