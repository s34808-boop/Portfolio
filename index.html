<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARMING PORTFOLIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

/* ==================================================
   BASIC
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    font-family:"Kanit",sans-serif;
    background:#ffffff;
    color:#222222;
}

body{
    min-height:100vh;
}

button{
    font-family:"Kanit",sans-serif;
}

img{
    max-width:100%;
}


/* ==================================================
   HEADER
================================================== */

header{
    height:90px;
    width:100%;
    background:#ffffff;
    border-bottom:1px solid #eeeeee;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:700;
    letter-spacing:1px;
}

.logo span{
    color:#f47721;
}

.menu-btn{
    width:64px;
    height:64px;

    border:none;
    border-radius:16px;

    background:#f47721;
    color:white;

    font-size:34px;

    cursor:pointer;
}


/* ==================================================
   MENU OVERLAY
================================================== */

.overlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.78);

    z-index:5000;

    padding:20px;

    align-items:center;
    justify-content:center;
}

.overlay.show{
    display:flex;
}

.menu-box{
    width:680px;
    max-width:100%;
    max-height:90vh;

    overflow:auto;

    background:#111111;

    border:1px solid #f47721;
    border-radius:28px;

    padding:28px 18px;
}

.menu-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.menu-head h2{
    color:#ffffff;
    font-size:27px;
}

.close-btn{
    width:58px;
    height:58px;

    border:1px solid #555555;
    border-radius:15px;

    background:#111111;
    color:#ffffff;

    font-size:32px;

    cursor:pointer;
}

.menu-title{
    text-align:center;

    color:#aaaaaa;

    font-size:19px;

    margin-bottom:22px;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.menu-item{
    min-height:130px;

    background:#1b1715;

    border:1px solid #f47721;
    border-radius:18px;

    color:#ffffff;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.menu-item:hover{
    background:#f47721;
}

.menu-icon{
    font-size:38px;
    margin-bottom:8px;
}

.menu-item b{
    font-size:18px;
}


/* ==================================================
   GENERAL PAGE
================================================== */

.page{
    width:100%;
    max-width:1100px;

    min-height:calc(100vh - 90px);

    margin:0 auto;

    padding:60px 6% 80px;
}

.back{
    display:inline-block;

    color:#df7838;

    font-size:20px;

    margin-bottom:35px;

    cursor:pointer;
}

.page h1{
    font-size:55px;
    line-height:1.2;

    margin-bottom:8px;
}

.subtitle{
    color:#df7838;

    font-size:20px;

    letter-spacing:5px;

    margin-bottom:40px;
}


/* ==================================================
   HOME
================================================== */

.home{
    width:100%;
    max-width:1200px;

    min-height:calc(100vh - 90px);

    margin:0 auto;

    padding:70px 6%;

    display:grid;

    grid-template-columns:1fr 430px;

    align-items:center;

    gap:70px;
}

.hello{
    color:#df7838;

    font-size:24px;

    letter-spacing:6px;

    margin-bottom:20px;
}

.tarming{
    font-size:70px;

    line-height:1;

    font-weight:700;

    margin-bottom:30px;
}

.tarming span{
    color:#f47721;
}

.home h1{
    font-size:32px;

    margin-bottom:15px;
}

.home p{
    color:#666666;

    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}

.buttons{
    display:flex;
    gap:15px;
}

.btn{
    padding:13px 25px;

    border-radius:12px;

    font-size:18px;

    cursor:pointer;
}

.btn-orange{
    background:#f47721;

    color:#ffffff;

    border:2px solid #f47721;
}

.btn-white{
    background:#ffffff;

    color:#df7838;

    border:2px solid #df7838;
}

.home-photo{
    width:100%;

    border:4px solid #f47721;

    border-radius:28px;

    overflow:hidden;

    box-shadow:0 15px 35px rgba(244,119,33,.15);
}

.home-photo img{
    width:100%;

    display:block;
}


/* ==================================================
   HISTORY
================================================== */

.history-photo{
    width:430px;
    max-width:100%;

    margin:0 auto 30px;

    border:4px solid #f47721;

    border-radius:30px;

    overflow:hidden;

    box-shadow:0 15px 35px rgba(244,119,33,.15);
}

.history-photo img{
    width:100%;
    display:block;
}

.info-card{
    background:#ffffff;

    border:1px solid #eeeeee;

    border-left:6px solid #f47721;

    border-radius:24px;

    padding:35px;

    box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.info-card h2{
    color:#e87532;

    font-size:30px;

    margin-bottom:20px;
}

.info-line{
    font-size:18px;

    line-height:1.9;

    margin:8px 0;
}

.info-line strong{
    color:#222222;
}


/* ==================================================
   EDUCATION
================================================== */

.education-list{
    display:grid;

    gap:20px;
}

.education-card{
    background:#ffffff;

    border:1px solid #eeeeee;

    border-left:6px solid #f47721;

    border-radius:22px;

    padding:28px;

    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.education-card h2{
    color:#e87532;

    font-size:25px;

    margin-bottom:8px;
}

.education-card p{
    color:#555555;

    font-size:18px;

    line-height:1.7;
}


/* ==================================================
   UNIVERSITY
================================================== */

.university-card{
    text-align:center;

    background:#fffaf5;

    border:2px solid #df7838;

    border-radius:28px;

    padding:40px 25px;

    box-shadow:0 15px 35px rgba(244,119,33,.08);
}

.university-logo{
    width:190px;
    height:190px;

    object-fit:contain;

    display:block;

    margin:0 auto 25px;

    border-radius:10px;
}

.dream{
    color:#df7838;

    font-size:20px;

    font-weight:600;

    letter-spacing:5px;

    margin-bottom:15px;
}

.university-card h2{
    font-size:30px;

    line-height:1.5;

    margin-bottom:12px;
}

.university-card h3{
    color:#df7838;

    font-size:25px;

    margin-bottom:8px;
}

.university-card p{
    color:#666666;

    font-size:19px;

    line-height:1.8;
}


/* ==================================================
   SKILLS
================================================== */

.skills-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

.skill-card{
    padding:28px;

    border:1px solid #eeeeee;

    border-radius:22px;

    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.skill-card h2{
    color:#e87532;

    font-size:24px;

    margin-bottom:10px;
}

.skill-card p{
    color:#666666;

    font-size:18px;

    line-height:1.7;
}


/* ==================================================
   RESEARCH / PROJECT
================================================== */

.project-list{
    display:grid;

    gap:22px;
}

.project-card{
    border:1px solid #eeeeee;

    border-left:6px solid #f47721;

    border-radius:22px;

    padding:28px;

    box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.project-card h2{
    color:#e87532;

    font-size:25px;

    margin-bottom:10px;
}

.project-card p{
    color:#666666;

    font-size:18px;

    line-height:1.7;
}

.project-image{
    width:100%;

    border-radius:18px;

    margin-top:20px;

    display:block;
}


/* ==================================================
   CONTACT
================================================== */

.contact-card{
    border-left:6px solid #f47721;

    border-top:1px solid #eeeeee;
    border-right:1px solid #eeeeee;
    border-bottom:1px solid #eeeeee;

    border-radius:25px;

    padding:35px;

    box-shadow:0 12px 35px rgba(0,0,0,.06);
}

.contact-line{
    font-size:19px;

    padding:18px 0;

    border-bottom:1px solid #eeeeee;
}

.contact-line:last-child{
    border-bottom:none;
}

.contact-line strong{
    color:#e87532;
}


/* ==================================================
   FOOTER
================================================== */

footer{
    background:#222222;

    color:#ffffff;

    text-align:center;

    padding:30px;

    font-size:17px;
}

footer span{
    color:#f47721;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:800px){

    header{
        height:80px;
    }

    .logo{
        font-size:27px;
    }

    .menu-btn{
        width:60px;
        height:60px;
    }

    .home{
        display:flex;

        flex-direction:column-reverse;

        align-items:stretch;

        gap:35px;

        padding:50px 6%;
    }

    .home-photo{
        max-width:430px;

        margin:0 auto;
    }

    .hello{
        font-size:19px;
    }

    .tarming{
        font-size:50px;
    }

    .home h1{
        font-size:27px;
    }

    .home p{
        font-size:17px;
    }

    .buttons{
        flex-wrap:wrap;
    }

    .page{
        padding:45px 6% 70px;
    }

    .page h1{
        font-size:43px;
    }

    .skills-grid{
        grid-template-columns:1fr;
    }

    .info-card{
        padding:25px;
    }

    .info-line{
        font-size:17px;
    }

    .university-logo{
        width:160px;
        height:160px;
    }

    .university-card h2{
        font-size:25px;
    }

    .university-card h3{
        font-size:22px;
    }

    .menu-box{
        padding:22px 14px;
    }

    .menu-grid{
        gap:10px;
    }

    .menu-item{
        min-height:115px;
    }

    .menu-icon{
        font-size:32px;
    }

    .menu-item b{
        font-size:16px;
    }

}


/* ==================================================
   VERY SMALL SCREEN
================================================== */

@media(max-width:400px){

    .menu-grid{
        grid-template-columns:1fr 1fr;
    }

    .tarming{
        font-size:44px;
    }

    .page h1{
        font-size:38px;
    }

}

</style>
</head>


<body>

     HEADER
================================================== -->

<div id="app"></div>


<script>


/* ==================================================
   IMAGE FILES
================================================== */

const PROFILE_IMAGE =
"file_0000000085d47207b52f2b182e7429b3.png";

const UNIVERSITY_LOGO =
"logo-lkmutnb.jpg";


/* ==================================================
   MENU
================================================== */

function openMenu(){

    document
        .getElementById("overlay")
        .classList
        .add("show");

}


function closeMenu(){

    document
        .getElementById("overlay")
        .classList
        .remove("show");

}


/* ==================================================
   GO TO PAGE
================================================== */

function go(page){

    closeMenu();

    window.location.hash = page;

    render(page);

    window.scrollTo(0,0);

}


/* ==================================================
   RENDER PAGE
================================================== */

function render(page){

    const app =
        document.getElementById("app");


    /*
       สำคัญที่สุด

       ทุกครั้งที่เปลี่ยนเมนู
       ล้างของเก่าทั้งหมดก่อน

       เพราะฉะนั้นจะไม่มี
       หน้าหลัก + ประวัติ + มหาลัย
       ต่อกันอีก
    */

    app.innerHTML = "";


    /* ==================================================
       HOME
    ================================================== */

    if(page === "home"){

        app.innerHTML = `

        <section class="home">


            <div>

                <div class="hello">
                    HELLO, I'M

                    แผนการเรียนเตรียมวิทยาการคอมพิวเตอร์
                    และวิศวกรรม (CSE)

                    <br>

                    มีความสนใจด้านวิศวกรรม
                    การบิน อวกาศ เทคโนโลยี
                    และการพัฒนาตนเอง

                </p>


                <div class="buttons">

                    <button
                        class="btn btn-orange"
                        onclick="go('history')">

                        รู้จักผมมากขึ้น

                    </button>


                    <button
                        class="btn btn-white"
                        onclick="go('contact')">

                        ติดต่อผม

                    </button>

                </div>

            </div>


            <div class="home-photo">

                <img
                    src="${PROFILE_IMAGE}"
                    alt="TARMING">

            </div>


        </section>


        <footer>

            © 2026
            <span>TARMING</span>
            PORTFOLIO

        </footer>

        `;

    }


    /* ==================================================
       HISTORY
    ================================================== */

    else if(page === "history"){

        app.innerHTML = `

        <section class="page">


            <div
                class="back"
                onclick="go('home')">

                ← กลับหน้าหลัก

            </div>


            <h1>
                ประวัติ
            </h1>


            <div class="subtitle">
                MY PROFILE
            </div>


            <div class="history-photo">

                <img
                    src="${PROFILE_IMAGE}"
                    alt="นาย เสฎฐวุฒิ พลหาญ">

            </div>


            <div class="info-card">


                <h2>
                    นาย เสฎฐวุฒิ พลหาญ
                </h2>


                <div class="info-line">

                    <strong>
                        ชื่อ-นามสกุล:
                    </strong>

                    นาย เสฎฐวุฒิ พลหาญ

                </div>


                <div class="info-line">

                    <strong>
                        ชื่อเล่น:
                    </strong>

                    ต้าหมิง

                </div>


                <div class="info-line">

                    <strong>
                        อายุ:
                    </strong>

                    17 ปี

                </div>


                <div class="info-line">

                    <strong>
                        วัน/เดือน/ปีเกิด:
                    </strong>

                    19 กุมภาพันธ์ 2552

                </div>


                <div class="info-line">

                    <strong>
                        แผนการเรียน:
                    </strong>

                    เตรียมวิทยาการคอมพิวเตอร์
                    และวิศวกรรม (CSE)

                </div>


                <div class="info-line">

                    <strong>
                        สถานที่ศึกษา:
                    </strong>

                    โรงเรียนบ้านบึง
                    อุตสาหกรรมนุเคราะห์

                </div>


                <div class="info-line">

                    <strong>
                        เชื้อชาติ:
                    </strong>

                    ไทย

                </div>


                <div class="info-line">

                    <strong>
                        สัญชาติ:
                    </strong>

                    ไทย

                </div>


                <div class="info-line">

                    <strong>
                        ศาสนา:
                    </strong>

                    คริสต์

                </div>


                <div class="info-line">

                    <strong>

                    โรงเรียนบ้านบึง

                </div>


            </div>


        </section>


        <footer>

            PORTFOLIO

        </footer>

        `;

    }


    /* ==================================================
       EDUCATION
    ================================================== */

    else if(page === "education"){

        app.innerHTML = `

            <div
                class="back"
                onclick="go('home')">

                ← กลับหน้าหลัก

            </div>


            <h1>
                การศึกษา
            </h1>


            <div class="subtitle">
                EDUCATION
            </div>


            <div class="education-list">


                <div class="education-card">

                    <h2>

                    </h2>

                        โรงเรียนบุญประทีปวิทยาคาร
                    </p>

                    <h2>
                        ระดับประถมศึกษา
                    </h2>

                    <p>
                        โรงเรียนบุญประทีปวิทยาคาร

                </div>


                <div class="education-card">

                    <h2>
                        ระดับมัธยมศึกษาตอนต้น
                    </h2>

                    <p>

                    </p>

                </div>


                <div class="education-card">

                    <h2>

        <footer>

        </footer>

        `;

    }


    /* ==================================================
       UNIVERSITY
    ================================================== */

    else if(page === "university"){

        app.innerHTML = `

        <section class="page">


            <div
                class="back"
                onclick="go('home')">

                ← กลับหน้าหลัก

            </div>


            <h1>
                มหาลัย
            </h1>


            <div class="subtitle">
                UNIVERSITY
            </div>


            <div class="university-card">


                <img
                    src="${UNIVERSITY_LOGO}"
                    alt="มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ"
                    class="university-logo"
                >


                <div class="dream">
                    MY DREAM
                </div>


                <h2>

                    มหาวิทยาลัยเทคโนโลยี
                    พระจอมเกล้าพระนครเหนือ

/* ==================================================
   เปิดหน้าแรก
================================================== */

let currentPage =
    window.location.hash.replace("#","");


const validPages = [
    "home",
    "history",
    "education",
    "university",
    "skills",
    "research",
    "contact"
];


if(!validPages.includes(currentPage)){

    currentPage = "home";

}


render(currentPage);


/* ==================================================
   BROWSER BACK / FORWARD
================================================== */

window.addEventListener(
    "hashchange",
    function(){

        let page =
            window.location.hash.replace("#","");

        if(!validPages.includes(page)){

            page = "home";

        }

        render(page);

        window.scrollTo(0,0);

    }
);

</script>
